<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page not found &ndash; Erik Taylor</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --link: #0a6cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --text: #ececec;
      --muted: #9a9a9a;
      --link: #6ba6ff;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  main { max-width: 32rem; }
  h1 {
    font-size: 5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  p {
    margin-top: 1rem;
    font-size: 1.125rem;
    color: var(--muted);
    line-height: 1.6;
  }
  a {
    display: inline-block;
    margin-top: 2rem;
    color: var(--link);
    font-size: 1.0625rem;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
  }
  a:hover { opacity: 0.75; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>That page doesn&rsquo;t exist &mdash; it may have moved when the site was rebuilt.</p>
  <a href="/">Back to the portfolio</a>
</main>
</body>
</html>
